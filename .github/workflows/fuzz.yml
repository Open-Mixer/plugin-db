name: fuzz
# The libFuzzer harnesses of fuzz/ (fuzz/README.md), built with clang under AddressSanitizer and
# UndefinedBehaviorSanitizer and fuzzed for 60 s each from their seed corpus. Before the run: the seed corpus is what
# fuzz-corpus writes, every check's mutant record is met on its own seed (make fuzz-records), every fuzz/sabotage/ patch
# is caught by the check it names (make fuzz-sabotage), and each harness holds its coverage floor with every check
# reached (make fuzz-coverage). A crashing input is uploaded as the fuzz-findings artifact. make test stays in ci.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A new push to a pull request cancels the run it supersedes. Every other run (main, a tag) has a group of its own
  # and is never cancelled; the run id keeps two pushes to main from replacing each other while one is queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # the cells the harnesses run: check-matrix's answer (rule 11-10: fc45 beside fc44;
  # the quick set while a release wave is open, the whole matrix declared here otherwise)
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rpm: ${{ steps.m.outputs.rpm }}
      rpm-count: ${{ steps.m.outputs.rpm-count }}
    steps:
      - id: m
        uses: Open-Mixer/.github/.github/actions/check-matrix@openmixer-v1
        with:
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          rpm-releases: '["44", "45"]'
          rpm-arches: '["x86_64"]'

  fuzz:
    needs: checks
    if: needs.checks.outputs.rpm-count != '0'
    name: fuzz the pin's text, the layout bytes and the digest (${{ matrix.cell.image }})
    runs-on: ubuntu-latest
    # A backstop: fuzz-run spends 60 s on each of three harnesses.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.checks.outputs.rpm) }}
    container: ${{ matrix.cell.image }}
    steps:
      - name: clang, libFuzzer, llvm-cov and libcrypto
        run: |
          dnf -y install --setopt=install_weak_deps=False --setopt=retries=10 clang compiler-rt llvm \
            gcc make git gawk diffutils pkgconf-pkg-config openssl-devel
      - uses: actions/checkout@v4
      # fuzz-records and fuzz-sabotage change include/ and put it back with git
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build the harnesses
        run: make fuzz
      - name: The seed corpus is what fuzz-corpus writes
        run: make fuzz-corpus-check
      - name: Every check's mutant record is met on its own seed
        run: make fuzz-records
      - name: Every sabotage patch is caught by the check it names, and only by it
        run: make fuzz-sabotage
      - name: Each harness holds its coverage floor and reaches every check
        run: make fuzz-coverage
      - name: Fuzz each harness for 60 s
        run: make fuzz-run FUZZ_TIME=60
      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings-fc${{ matrix.cell.fedora }}-${{ matrix.cell.arch }}
          path: fuzz/findings/
          if-no-files-found: ignore
