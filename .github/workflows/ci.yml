name: ci
# A push runs on main only; a pull request already runs its branch.
on:
  push:
    branches: [main, dedupe/all]
  pull_request:
permissions:
  contents: read
concurrency:
  # A new push to a pull request cancels the run it supersedes. Every other run (main, a tag) has a group of its own
  # and is never cancelled; the run id keeps two pushes to main from replacing each other while one is queued.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # the shared checks, from Open-Mixer/.github and nowhere else: the commit messages, no private reference, no local copy
  public-sources:
    uses: Open-Mixer/.github/.github/workflows/public-sources-check.yml@openmixer-v1

  test:
    name: build + test (${{ matrix.image }})
    runs-on: ubuntu-latest
    # A backstop only.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:44', 'debian:bookworm', 'debian:trixie']
    # privileged only to lower the runner kernel's mmap_rnd_bits: with the hosted image's 32 bits, bookworm's gcc 12
    # AddressSanitizer dies in DEADLYSIGNAL loops until the timeout (newer libasan copes)
    container:
      image: ${{ matrix.image }}
      options: --privileged
    steps:
      - name: Address space randomisation AddressSanitizer can run under
        run: |
          if [ "$(cat /proc/sys/vm/mmap_rnd_bits)" -gt 28 ]; then echo 28 > /proc/sys/vm/mmap_rnd_bits; fi
          echo "vm.mmap_rnd_bits=$(cat /proc/sys/vm/mmap_rnd_bits)"
      - name: Toolchain
        run: |
          if command -v dnf >/dev/null; then
            dnf -y install gcc make pkgconf-pkg-config openssl-devel python3 diffutils libasan libubsan
          else
            apt-get update && apt-get -y install --no-install-recommends gcc libc6-dev make pkg-config libssl-dev python3
          fi
      - uses: actions/checkout@v4
      - name: Add the OpenMixer channel
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
      # the pin path codec is plugin-hostd-protocol's (phd_pin_path_*, header inline)
      - name: plugin-hostd-protocol's headers
        run: |
          if command -v dnf >/dev/null; then dnf -y install 'plugin-hostd-protocol-devel >= 0.5.0' 'plugin-hostd-protocol-devel < 0.6'
          else apt-get -y install --no-install-recommends libplugin-hostd-protocol-dev
            v=$(dpkg-query -W -f='${Version}' libplugin-hostd-protocol-dev)
            dpkg --compare-versions "$v" ge 0.5.0~ && dpkg --compare-versions "$v" lt 0.6~ || { echo "libplugin-hostd-protocol-dev $v is outside 0.5.0..0.6"; exit 1; }
          fi
      - name: Tests (known answers, the derived tables, the state by table, the collection, the store, a consumer of an install, the sabotage arms, the version)
        run: make test
      - name: The C tests and the command under AddressSanitizer and UBSan
        run: make test-asan

  # The reader's TypeScript twin: its tests over tests/golden/, the same fixtures `plugin-db query --json` is held to, the
  # conformance check of the sources and the arms that must turn them red. Node is the distribution's, not installed
  # from a package manager: the twin has no dependency.
  twin:
    name: reader twin (node)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: fedora:44
    steps:
      - name: Toolchain
        run: dnf -y install gcc make pkgconf-pkg-config openssl-devel python3 diffutils nodejs
      - uses: actions/checkout@v4
      - name: Add the OpenMixer channel
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
      - name: plugin-hostd-protocol's headers
        run: dnf -y install 'plugin-hostd-protocol-devel >= 0.5.0' 'plugin-hostd-protocol-devel < 0.6'
      - name: Node is in the twin's range
        run: node -e 'const [a,b]=process.versions.node.split(".").map(Number); if (a>=25 || a<22 || (a==22 && b<18)) { console.error("node " + process.version + " is outside 22.18 .. 24"); process.exit(1) }'
      - name: make test-twin
        run: make test-twin

  # The declared words, with the tools a package build does not carry: the rendered header is what the installed
  # omx-contract renders from data/ (and a header changed by hand is red), and data/ as a package validates.
  words:
    name: declared words (render, contract directory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: fedora:44
    steps:
      - name: Toolchain
        run: dnf -y install git make pkgconf-pkg-config diffutils
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Add the OpenMixer channel
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          # omx-contract 3.16 (catalog provenance, the language list, translate) is staged and not yet served
          staging: 'true'
      # a dedupe/all run builds on its siblings' dedupe/all (.github/wave-deps); @main until Open-Mixer/.github moves v1 past it
      - uses: Open-Mixer/.github/.github/actions/wave-deps@openmixer-v1
      - name: omx-contract
        run: dnf -y install 'omx-contract >= 3.16.0' 'omx-contract < 4' 'omx-contract-devel >= 3.16.0' 'omx-contract-devel < 4'
      - name: make check-tools
        run: make check-tools
      # one pack per listed language from the spec and debian/control, and the catalogs through omx-contract's release
      # gate (translate --check): a listed language with no catalog, a missing key or a stale entry is red
      - name: The language packs
        uses: Open-Mixer/.github/.github/actions/langpacks@openmixer-v1
        with:
          name: plugin-db
          base: plugin-db-contract
          owner: plugin-db
          spec: packaging/plugin-db.spec
          moved: ca:0.3.3
          gate: omx-contract translate --check --data data --catalogs catalogs --package plugin-db

  # The records a host fills: their layout as abi/ holds it (make test-abi runs in the test job above), and the types as
  # libabigail reads them from tests/abi-probe.c against abi/plugin-db.abi.
  abi:
    name: ABI check (abidiff against abi/)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: fedora:44
    steps:
      - name: Toolchain
        run: dnf -y install gcc make git pkgconf-pkg-config openssl-devel diffutils binutils libabigail
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Layout of the records
        run: make test-abi
      - name: Types against the baseline
        run: make abi-check
