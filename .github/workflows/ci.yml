name: ci
# Run by workflow_dispatch: on a pull request's head before it is merged (gh workflow run ci.yml --ref <branch>),
# and on demand. The fast checks run on every pull request from public-sources.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Every dispatch has a group of its own (the run id) and is never cancelled.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # no Fedora release written into a job: every Fedora cell comes from check-matrix (ruling D25)
  fedora-cells:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - uses: Open-Mixer/.github/.github/actions/fedora-cells@openmixer-v1

  # the cells the test job runs: check-matrix's answer (ruling D25: the quick set while a release wave is open, the whole
  # matrix declared here otherwise). Each cell names its container image and the runner of its own architecture: the
  # channel's development debs are trixie arm64 only, and an amd64 container resolves an arm64 -dev package that dpkg
  # then refuses
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rpm: ${{ steps.m.outputs.rpm }}
      rpm-count: ${{ steps.m.outputs.rpm-count }}
      cells: ${{ steps.m.outputs.cells }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - id: m
        uses: Open-Mixer/.github/.github/actions/check-matrix@openmixer-v1
        with:
          wave: ${{ vars.OMX_RELEASE_MATRIX }}
          rpm-releases: '["45"]'
          rpm-arches: '["x86_64"]'
          # Debian trixie only: the releases the shared build-deb.yml publishes (no bookworm, owner 2026-11-28)
          deb-releases: '["trixie"]'
          deb-arches: '["amd64", "arm64"]'

  test:
    name: build + test (${{ matrix.cell.image }}, ${{ matrix.cell.arch }})
    needs: checks
    if: needs.checks.outputs.count != '0'
    runs-on: ${{ matrix.cell.runner }}
    # A backstop only.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.checks.outputs.cells) }}
    # privileged only to lower the runner kernel's mmap_rnd_bits: with the hosted image's 32 bits, bookworm's gcc 12
    # AddressSanitizer dies in DEADLYSIGNAL loops until the timeout (newer libasan copes)
    container:
      image: ${{ matrix.cell.image }}
      options: --privileged
    steps:
      - name: Address space randomisation AddressSanitizer can run under
        run: |
          if [ "$(cat /proc/sys/vm/mmap_rnd_bits)" -gt 28 ]; then echo 28 > /proc/sys/vm/mmap_rnd_bits; fi
          echo "vm.mmap_rnd_bits=$(cat /proc/sys/vm/mmap_rnd_bits)"
      - name: Toolchain
        run: |
          if command -v dnf >/dev/null; then
            dnf -y install gcc make pkgconf-pkg-config openssl-devel python3 diffutils libasan libubsan
          else
            apt-get update && apt-get -y install --no-install-recommends gcc libc6-dev make pkg-config libssl-dev python3
          fi
      - uses: actions/checkout@v4
      - name: Add the OpenMixer channel
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          # a pull request into devel, or a dispatch off main, in a wave reads that wave's devel channel and its base above staging
          devel-channel: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_CHANNEL || '' }}
          devel-base: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_BASE || '' }}
      # the pin path codec is plugin-hostd-protocol's (phd_pin_path_*, header inline)
      - name: plugin-hostd-protocol's headers
        run: |
          if command -v dnf >/dev/null; then dnf -y install plugin-hostd-protocol-devel plugin-hostd-protocol-contract
          else apt-get -y install --no-install-recommends libplugin-hostd-protocol-dev plugin-hostd-protocol-contract
          fi
      # the format words are read from the domain plugin-db through libomx-domain: its header, pkg-config file and the omx-domain command
      - name: libomx-domain's headers
        run: |
          if command -v dnf >/dev/null; then dnf -y install libomx-domain-devel
          else apt-get -y install --no-install-recommends libomx-domain-dev
          fi
      # text() reads the catalogs through omx-contract's reader, imported as omx_contract.catalog, which
      # python3-omx-contract ships (python3-plugin-db requires it). omx-contract-devel's pkg-config file names
      # the contract directory the pin words are read from (CONTRACTDIR); without it the Makefile looks under /usr/local.
      - name: omx-contract's catalog reader and contract directory
        run: |
          if command -v dnf >/dev/null; then dnf -y install python3-omx-contract omx-contract-devel
          else apt-get -y install --no-install-recommends python3-omx-contract libomx-contract-dev
          fi
          python3 -c 'import omx_contract.catalog'
      - name: Tests (known answers, the derived tables, the state by table, the collection, the store, a consumer of an install, the sabotage arms, the version)
        run: make test
      - name: The C tests and the command under AddressSanitizer and UBSan
        run: make test-asan

  # The reader's TypeScript twin: its tests over tests/golden/, the same fixtures `plugin-db query --json` is held to, the
  # conformance check of the sources and the arms that must turn them red. Node is the distribution's, not installed
  # from a package manager: the twin has no dependency.
  twin:
    name: reader twin (node) (${{ matrix.cell.image }})
    needs: checks
    if: needs.checks.outputs.rpm-count != '0'
    runs-on: ${{ matrix.cell.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.checks.outputs.rpm) }}
    container:
      image: ${{ matrix.cell.image }}
    steps:
      - name: Toolchain
        run: dnf -y install gcc make pkgconf-pkg-config openssl-devel python3 diffutils nodejs
      - uses: actions/checkout@v4
      - name: Add the OpenMixer channel
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          # a pull request into devel, or a dispatch off main, in a wave reads that wave's devel channel and its base above staging
          devel-channel: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_CHANNEL || '' }}
          devel-base: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_BASE || '' }}
      - name: plugin-hostd-protocol's headers
        run: dnf -y install plugin-hostd-protocol-devel plugin-hostd-protocol-contract
      # the twins' pin words are read from the contract directory omx-contract-devel's pkg-config file names
      - name: omx-contract's contract directory
        run: dnf -y install omx-contract-devel
      - name: libomx-domain's headers
        run: dnf -y install libomx-domain-devel
      - name: Node is at or above the twin's floor (third-party, kept; no ceiling)
        run: node -e 'const [a,b]=process.versions.node.split(".").map(Number); if (a<22 || (a==22 && b<18)) { console.error("node " + process.version + " is below 22.18"); process.exit(1) }'
      - name: make test-twin
        run: make test-twin

  # The declared words, with the tools a package build does not carry: the rendered headers are what the installed
  # omx-contract renders from the domain plugin-db (and a header changed by hand is red), and the domains validate.
  words:
    name: declared words (render, contract directory) (${{ matrix.cell.image }})
    needs: checks
    if: needs.checks.outputs.rpm-count != '0'
    runs-on: ${{ matrix.cell.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.checks.outputs.rpm) }}
    container:
      image: ${{ matrix.cell.image }}
    steps:
      - name: Toolchain
        run: dnf -y install git make gcc pkgconf-pkg-config openssl-devel python3 diffutils
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Add the OpenMixer channel
        uses: Open-Mixer/.github/.github/actions/add-openmixer@openmixer-v1
        with:
          # a pull request into devel, or a dispatch off main, in a wave reads that wave's devel channel and its base above staging
          devel-channel: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_CHANNEL || '' }}
          devel-base: ${{ ((startsWith(github.event_name, 'pull_request') && github.base_ref == 'devel') || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && vars.OMX_DEVEL_BASE || '' }}
      # a dedupe/all run builds on its siblings' dedupe/all (.github/wave-deps); @main until Open-Mixer/.github moves v1 past it
      - uses: Open-Mixer/.github/.github/actions/wave-deps@openmixer-v1
      # libomx-domain-devel ships omx-domain, the loader's command (make test-domain opens the plugin-db domain with it), and
      # the header the command and the tests build on; the installer's --domain mode, which names the installing package, comes with omx-contract-devel
      - name: omx-contract and the loader
        run: dnf -y install omx-contract omx-contract-devel libomx-domain-devel plugin-hostd-protocol-devel plugin-hostd-protocol-contract
      # validate --installed reads every installed domain: plugin-hostd-protocol's verbs refer to omx-clap's HOST_REPLY_CODES,
      # and plugin-hostd-protocol-contract does not require omx-clap-contract
      - name: omx-clap's contract, which plugin-hostd-protocol's verbs refer to
        run: dnf -y install omx-clap-contract
      - name: make check-tools
        run: make check-tools
      # one pack per listed language from the spec and debian/control, and the catalogs through omx-contract's release
      # gate (translate --check): a listed language with no catalog, a missing key or a stale entry is red
      - name: The language packs
        uses: Open-Mixer/.github/.github/actions/langpacks@openmixer-v1
        with:
          name: plugin-db
          base: plugin-db-contract
          owner: plugin-db
          spec: packaging/plugin-db.spec
          gate: sh tools/translate.sh --check
          fill-command: sh tools/translate.sh
